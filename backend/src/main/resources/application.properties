# =============================================================================
# Fichier de configuration de l'application backend SM Consulting
# =============================================================================
# Spring Boot lit automatiquement ce fichier au démarrage. Chaque ligne
# "cle=valeur" configure un aspect du serveur ou d'une librairie.
#
# Projet basé sur Spring Boot 4.1 (Spring Framework 7 / Jakarta EE 11) :
# Hibernate est désormais en version 7.x et le serveur Tomcat embarqué en
# version 11+, mais toutes les clés de configuration ci-dessous conservent
# exactement le même nom qu'en Spring Boot 3 — aucune adaptation nécessaire
# par rapport à un projet Spring Boot 3 existant sur ce point précis.

# Nom de l'application (apparaît dans les logs au démarrage)
spring.application.name=sm-consulting-backend

# -----------------------------------------------------------------------------
# Serveur web
# -----------------------------------------------------------------------------
# Port sur lequel le serveur backend écoute les requêtes HTTP.
server.port=8080

# -----------------------------------------------------------------------------
# Base de données H2 (en mémoire)
# -----------------------------------------------------------------------------
# H2 est une base de données légère qui tourne directement dans la mémoire du
# serveur : parfaite pour démarrer rapidement, mais ATTENTION, toutes les
# données sont perdues à chaque redémarrage du serveur !
#
# Pour un vrai environnement de production, remplacez ces lignes par la
# configuration d'une base persistante, par exemple PostgreSQL :
#
#   spring.datasource.url=jdbc:postgresql://localhost:5432/smconsulting
#   spring.datasource.username=smconsulting
#   spring.datasource.password=changez-moi
#   spring.jpa.hibernate.ddl-auto=validate
#
# ...et ajoutez la dépendance "org.postgresql:postgresql" dans le pom.xml
# à la place (ou en complément) de la dépendance H2.

spring.datasource.url=jdbc:h2:mem:smconsulting
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# ddl-auto=update : Hibernate crée/adapte automatiquement les tables à partir
# de nos entités JPA (pratique en développement). En production, on préfère
# généralement gérer les migrations de schéma avec un outil dédié comme
# Flyway ou Liquibase, et utiliser ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=update

# Affiche les requêtes SQL générées par Hibernate dans la console (utile pour
# apprendre et déboguer ; à désactiver en production pour ne pas polluer les logs).
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Active la console web H2, accessible sur http://localhost:8080/h2-console
# une fois le serveur démarré. Cela permet d'explorer visuellement les
# données de la table "contact_requests" sans installer d'outil externe.
# Identifiants de connexion à utiliser dans la console : JDBC URL =
# jdbc:h2:mem:smconsulting, utilisateur = sa, mot de passe = (vide).
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# -----------------------------------------------------------------------------
# Configuration propre à SM Consulting
# -----------------------------------------------------------------------------
# Origine autorisée pour les appels CORS (voir config/CorsConfig.java).
# En développement, c'est l'adresse du serveur de développement Vite.
# En production, remplacez cette valeur par le vrai nom de domaine du site,
# par exemple : https://www.sm-consulting.fr
app.cors.allowed-origin=http://localhost:5173
